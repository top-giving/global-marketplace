<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>منصة الملابس الرجالية - الطلب المباشر</title>
    <style>
        :root { --primary-color: #1a1a1a; --accent-color: #d35400; --bg-color: #f4f4f4; }
        body { font-family: 'Segoe UI', sans-serif; background-color: var(--bg-color); margin: 0; padding: 20px; }
        
        /* الهيدر والسلة */
        header { display: flex; justify-content: space-between; align-items: center; background: white; padding: 15px 30px; border-radius: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); sticky: top; }
        .cart-icon { cursor: pointer; position: relative; font-size: 1.2em; background: #eee; padding: 10px; border-radius: 50%; }
        #cartCount { position: absolute; top: -5px; right: -5px; background: red; color: white; border-radius: 50%; padding: 2px 6px; font-size: 12px; }

        /* شبكة المنتجات والمتاجر */
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(250px, 1fr)); gap: 20px; margin-top: 20px; }
        .card { background: white; padding: 15px; border-radius: 8px; text-align: center; box-shadow: 0 4px 6px rgba(0,0,0,0.05); }
        .card img { width: 100%; height: 250px; object-fit: cover; border-radius: 5px; }
        
        /* الأزرار */
        .btn { background: var(--primary-color); color: white; border: none; padding: 10px 15px; border-radius: 5px; cursor: pointer; width: 100%; margin-top: 10px; }
        .btn-order { background: #25d366; font-weight: bold; font-size: 1.1em; }
        .btn-back { width: auto; background: #777; margin-bottom: 20px; display: none; }

        /* شاشة السلة */
        #cartModal { display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); background: white; padding: 30px; border-radius: 15px; box-shadow: 0 0 20px rgba(0,0,0,0.3); z-index: 1000; width: 90%; max-width: 400px; }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 999; }
    </style>
</head>
<body>

    <header>
        <h3>سوق الملابس الرجالية</h3>
        <div class="cart-icon" onclick="toggleCart()">
            🛒 <span id="cartCount">0</span>
        </div>
    </header>

    <br>
    <button class="btn btn-back" id="backBtn" onclick="showStores()">← العودة لقائمة المتاجر</button>

    <div id="storesView" class="grid"></div>

    <div id="productsView" style="display:none;">
        <h2 id="storeTitle"></h2>
        <div id="productsList" class="grid"></div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div id="cartModal">
        <h3>سلة المشتريات</h3>
        <div id="cartItems"></div>
        <hr>
        <p>الإجمالي: <span id="totalPrice">0</span> ريال</p>
        <button class="btn btn-order" onclick="checkout()">إرسال الطلب عبر واتساب</button>
    </div>

    <script>
        // --- 1. الإعدادات البرمجية ---
        const MY_PHONE = "9665XXXXXXXX"; // ضع رقمك هنا بالكود الدولي بدون +
        const stores = [
            { id: 1, name: "متجر الفخامة (ثياب)", products: [{id: 101, name: "ثوب قطني", price: 200, img: "https://images.unsplash.com/photo-1593030761757-71fae45fa0e7?w=400"}] },
            { id: 2, name: "متجر الجودة (ملابس جاهزة)", products: [{id: 201, name: "قميص رسمي", price: 150, img: "https://images.unsplash.com/photo-1624378439575-d8705ad7ae80?w=400"}] }
        ];

        let cart = [];

        // --- 2. وظائف العرض ---
        function init() {
            const container = document.getElementById('storesView');
            stores.forEach(s => {
                container.innerHTML += `<div class="card"><h3>${s.name}</h3><button class="btn" onclick="openStore(${s.id})">دخول</button></div>`;
            });
        }

        function openStore(id) {
            const store = stores.find(s => s.id === id);
            document.getElementById('storesView').style.display = 'none';
            document.getElementById('productsView').style.display = 'block';
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('storeTitle').innerText = store.name;
            
            const list = document.getElementById('productsList');
            list.innerHTML = '';
            store.products.forEach(p => {
                list.innerHTML += `
                    <div class="card">
                        <img src="${p.img}">
                        <h4>${p.name}</h4>
                        <p>${p.price} ريال</p>
                        <button class="btn" onclick="addToCart('${p.name}', ${p.price})">أضف للسلة</button>
                    </div>`;
            });
        }

        function showStores() {
            document.getElementById('storesView').style.display = 'grid';
            document.getElementById('productsView').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
        }

        // --- 3. منطق السلة والواتساب ---
        function addToCart(name, price) {
            cart.push({name, price});
            document.getElementById('cartCount').innerText = cart.length;
            alert("تمت الإضافة للسلة");
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            const overlay = document.getElementById('overlay');
            const itemsDiv = document.getElementById('cartItems');
            
            itemsDiv.innerHTML = cart.map(i => `<p>${i.name} - ${i.price} ريال</p>`).join('');
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('totalPrice').innerText = total;

            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function checkout() {
            if(cart.length === 0) return alert("السلة فارغة");
            let msg = "مرحباً، أريد طلب:\n" + cart.map(i => `- ${i.name}`).join('\n');
            msg += `\n\nالإجمالي: ${document.getElementById('totalPrice').innerText} ريال`;
            window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`);
        }

        init();
    </script>
</body>
</html>
