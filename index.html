<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق الملابس الرجالية | TOP GIVING</title>
    <style>
        :root {
            --soft-white: #fcfcfc;
            --main-black: #1a1a1a;
            --gold-accent: #c5a059;
            --text-gray: #7f8c8d;
        }

        body { 
            font-family: 'Segoe UI', Roboto, sans-serif; 
            background-color: var(--soft-white); 
            margin: 0; padding: 0; color: var(--main-black);
        }

        /* هيدر ناصع البياض وبسيط */
        header { 
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            padding: 20px; text-align: center;
            border-bottom: 1px solid #eee;
            position: sticky; top: 0; z-index: 1000;
        }
        header h1 { 
            font-size: 1.4em; font-weight: 300; letter-spacing: 3px; 
            color: var(--main-black); margin: 0;
        }

        /* سلة المشتريات بشكل عصري */
        .cart-btn {
            background: var(--main-black); color: white;
            border: none; padding: 8px 25px; border-radius: 4px;
            margin-top: 15px; cursor: pointer; font-size: 0.9em;
            letter-spacing: 1px;
        }

        .container { max-width: 1200px; margin: 50px auto; padding: 0 20px; }
        
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 40px; }

        /* بطاقة المتجر بتصميم Minimalist */
        .store-card { 
            background: white; border-radius: 0; padding: 50px 20px; 
            text-align: center; cursor: pointer; transition: 0.4s;
            border: 1px solid #f0f0f0;
        }
        .store-card:hover { 
            box-shadow: 0 15px 40px rgba(0,0,0,0.05);
            border-color: var(--gold-accent);
        }
        .store-card h2 { 
            font-weight: 400; font-size: 1.6em; margin-bottom: 10px; 
            letter-spacing: 1px;
        }
        .store-card p { color: var(--text-gray); font-size: 0.85em; margin-bottom: 25px; }

        .btn-discover {
            background: transparent; border: 1px solid var(--main-black);
            padding: 10px 30px; font-size: 0.8em; font-weight: bold;
            transition: 0.3s; cursor: pointer;
        }
        .store-card:hover .btn-discover {
            background: var(--main-black); color: white;
        }

        /* عرض المنتجات */
        .product-card { background: white; padding: 15px; text-align: center; }
        .product-img { 
            width: 100%; height: 350px; background: #f7f7f7; 
            margin-bottom: 20px; display: flex; align-items: center; 
            justify-content: center; color: #ccc; font-size: 0.8em;
        }

        /* السلة */
        #cartModal { 
            display: none; position: fixed; top: 0; left: 0; 
            width: 100%; height: 100%; background: white; 
            z-index: 2000; padding: 50px; box-sizing: border-box;
        }
    </style>
</head>
<body>

    <header>
        <h1>TOP GIVING MARKET</h1>
        <button class="cart-btn" onclick="toggleCart()">حقيبة التسوق (<span id="cartCount">0</span>)</button>
    </header>

    <div class="container">
        <div id="storesWrapper" class="grid">
            </div>

        <div id="productsWrapper" style="display:none;">
            <button onclick="showStoresList()" style="background:none; border:none; cursor:pointer; margin-bottom:30px;">← العودة للمتاجر</button>
            <h2 id="currentStoreName" style="text-align:center; font-weight:300; font-size:2em; margin-bottom:40px;"></h2>
            <div id="productsGrid" class="grid"></div>
        </div>
    </div>

    <div id="cartModal">
        <button onclick="toggleCart()" style="float:left; background:none; border:none; font-size:1.5em; cursor:pointer;">✕</button>
        <h2 style="font-weight:300;">طلباتك المختارة</h2>
        <div id="cartItems" style="margin-top:50px;"></div>
        <hr style="border:0; border-top:1px solid #eee; margin:40px 0;">
        <div style="font-size: 1.5em;">الإجمالي: <span id="totalPrice">0</span> ريال</div>
        <button class="cart-btn" style="width:100%; padding:20px; margin-top:30px; background:#25d366;" onclick="sendToWhatsApp()">إرسال الطلب عبر واتساب</button>
    </div>

    <script>
        const MY_PHONE = "966560564719";
        const storesData = [
            { id: 1, name: "توب جيفينج", desc: "أحدث موديلات الملابس الجاهزة" },
            { id: 2, name: "أناقة الشرق", desc: "تميز في اختياراتك الرجالية" },
            { id: 3, name: "عزوة", desc: "للملابس الفاخرة والعصرية" },
            { id: 4, name: "زهرة بلقيس", desc: "تشكيلة ملابس جاهزة متنوعة" },
            { id: 5, name: "ديرة نجد", desc: "أناقة الملبس الرجالي الجاهز" },
            { id: 6, name: "علي عقيل", desc: "موديلات حصرية بجودة عالية" }
        ];

        const demoProducts = [
            { name: "تيشيرت بريميوم", price: 150 },
            { name: "بنطال كلاسيك", price: 180 },
            { name: "جاكيت عصري", price: 320 }
        ];

        let cart = [];

        function renderStores() {
            const wrapper = document.getElementById('storesWrapper');
            wrapper.innerHTML = '';
            storesData.forEach(store => {
                wrapper.innerHTML += `
                    <div class="store-card" onclick="viewStore(${store.id})">
                        <h2>${store.name}</h2>
                        <p>${store.desc}</p>
                        <button class="btn-discover">اكتشف المجموعة</button>
                    </div>`;
            });
        }

        function viewStore(id) {
            const store = storesData.find(s => s.id === id);
            document.getElementById('storesWrapper').style.display = 'none';
            document.getElementById('productsWrapper').style.display = 'block';
            document.getElementById('currentStoreName').innerText = store.name;

            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            demoProducts.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="product-img">صورة المنتج</div>
                        <h3 style="font-weight:400;">${item.name}</h3>
                        <p style="color:var(--gold-accent); font-weight:bold;">${item.price} ريال</p>
                        <button class="btn-discover" onclick="addToCart('${item.name}', ${item.price}, '${store.name}')">أضف للحقيبة</button>
                    </div>`;
            });
        }

        function showStoresList() {
            document.getElementById('storesWrapper').style.display = 'grid';
            document.getElementById('productsWrapper').style.display = 'none';
            renderStores();
        }

        function addToCart(name, price, store) {
            cart.push({name, price, store});
            document.getElementById('cartCount').innerText = cart.length;
            event.stopPropagation();
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            const itemsDiv = document.getElementById('cartItems');
            itemsDiv.innerHTML = cart.length === 0 ? "<p>الحقيبة فارغة</p>" : 
                cart.map(i => `<p>${i.name} - ${i.price} ريال</p>`).join('');
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('totalPrice').innerText = total;
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
        }

        function sendToWhatsApp() {
            if(cart.length === 0) return;
            let msg = "*طلب من TOP GIVING MARKET*\n";
            cart.forEach((i, idx) => msg += `${idx+1}. ${i.name} - ${i.price} ريال\n`);
            msg += `\n*الإجمالي: ${document.getElementById('totalPrice').innerText} ريال*`;
            window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`);
        }

        renderStores();
    </script>
</body>
</html>
