<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>سوق الملابس الرجالية | الرؤية الحديثة</title>
    <style>
        /* هوية الألوان المستوحاة من بنك فيجن */
        :root {
            --vision-navy: #0a192f; /* الأزرق الداكن الفخم */
            --vision-gold: #c5a059; /* الذهبي الراقي */
            --vision-light: #f4f7fa; /* خلفية هادئة */
            --vision-white: #ffffff;
            --vision-text: #2d3436;
        }

        body { 
            font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; 
            background-color: var(--vision-light); 
            margin: 0; 
            padding: 0; 
            color: var(--vision-text);
        }
        
        /* الهيدر بتصميم بنكي حديث */
        header { 
            background: var(--vision-navy); 
            padding: 25px; 
            text-align: center; 
            box-shadow: 0 4px 20px rgba(0,0,0,0.15); 
            position: sticky; 
            top: 0; 
            z-index: 1000;
            border-bottom: 3px solid var(--vision-gold);
        }
        header h1 { 
            color: var(--vision-white); 
            margin: 0; 
            font-size: 1.6em; 
            letter-spacing: 1px;
            text-transform: uppercase;
        }
        
        .cart-box { 
            margin-top: 15px; 
            cursor: pointer; 
            color: var(--vision-navy); 
            background: var(--vision-gold); 
            display: inline-block; 
            padding: 10px 25px; 
            border-radius: 30px; 
            font-weight: bold;
            transition: 0.3s;
            box-shadow: 0 4px 10px rgba(197, 160, 89, 0.3);
        }
        .cart-box:hover { transform: scale(1.05); }

        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        /* بطاقات المتاجر بتصميم Premium */
        .store-card { 
            background: var(--vision-white); 
            border-radius: 20px; 
            padding: 40px 20px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.4s; 
            border: 1px solid rgba(10, 25, 47, 0.05);
            position: relative;
            overflow: hidden;
        }
        .store-card::before {
            content: ''; position: absolute; top: 0; left: 0; width: 100%; height: 5px; background: var(--vision-gold);
        }
        .store-card:hover { 
            transform: translateY(-12px); 
            box-shadow: 0 20px 40px rgba(10, 25, 47, 0.1); 
        }
        .store-card h2 { color: var(--vision-navy); margin-bottom: 10px; }
        .store-card p { color: #636e72; font-size: 0.95em; }

        /* بطاقة المنتج */
        .product-card { 
            background: var(--vision-white); 
            border-radius: 15px; 
            padding: 20px; 
            text-align: center; 
            box-shadow: 0 5px 15px rgba(0,0,0,0.02);
            border-bottom: 2px solid transparent;
            transition: 0.3s;
        }
        .product-card:hover { border-bottom: 2px solid var(--vision-gold); }
        .img-placeholder { 
            width: 100%; height: 260px; background: #eaeff5; border-radius: 12px; 
            display: flex; align-items: center; justify-content: center; color: #95a5a6; margin-bottom: 15px; 
        }
        
        /* الأزرار بنمط بنكي */
        .btn { border: none; padding: 14px; border-radius: 10px; cursor: pointer; font-weight: bold; width: 100%; transition: 0.3s; }
        .btn-dark { background: var(--vision-navy); color: var(--vision-white); }
        .btn-dark:hover { background: #1c2d4d; }
        .btn-back { background: #dfe6e9; color: var(--vision-navy); width: auto; margin-bottom: 30px; display: none; }
        .btn-whatsapp { background: #27ae60; color: white; font-size: 1.1em; margin-top: 20px; }

        /* السلة الحديثة */
        #cartModal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: var(--vision-white); padding: 35px; border-radius: 25px; z-index: 2000; 
            width: 90%; max-width: 450px; box-shadow: 0 30px 60px rgba(0,0,0,0.4); 
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(10, 25, 47, 0.85); z-index: 1500; backdrop-filter: blur(8px); }
    </style>
</head>
<body>

    <header>
        <h1>سوق الملابس الرجالية | VISION</h1>
        <div class="cart-box" onclick="toggleCart()">🛒 ملخص السلة (<span id="cartCount">0</span>)</div>
    </header>

    <div class="container">
        <button class="btn btn-back" id="backBtn" onclick="showStoresList()">← العودة للشركاء</button>
        <div id="storesWrapper" class="grid"></div>
        <div id="productsWrapper" style="display:none;">
            <h2 id="currentStoreName" style="text-align: center; color: var(--vision-navy); margin-bottom: 35px;"></h2>
            <div id="productsGrid" class="grid"></div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div id="cartModal">
        <h3 style="color: var(--vision-navy); text-align: center;">إتمام عملية الطلب</h3>
        <div id="cartItems" style="max-height: 250px; overflow-y: auto;"></div>
        <hr style="border: 0; border-top: 1px solid #eee; margin: 20px 0;">
        <div style="display: flex; justify-content: space-between; align-items: center;">
            <span style="font-weight: bold; font-size: 1.2em;">إجمالي الاستحقاق:</span>
            <span style="color: var(--vision-gold); font-weight: bold; font-size: 1.5em;"><span id="totalPrice">0</span> ريال</span>
        </div>
        <button class="btn btn-whatsapp" onclick="sendToWhatsApp()">إرسال الطلب عبر WhatsApp</button>
    </div>

    <script>
        const MY_PHONE = "966560564719";

        const storesData = [
            { id: 1, name: "توب جيفينج", desc: "أحدث موديلات الملابس الجاهزة" },
            { id: 2, name: "أناقة الشرق", desc: "تميز في اختياراتك الرجالية" },
            { id: 3, name: "عزوة", desc: "للملابس الفاخرة والعصرية" },
            { id: 4, name: "زهرة بلقيس", desc: "تشكيلة ملابس جاهزة متنوعة" },
            { id: 5, name: "ديرة نجد", desc: "أناقة الملبس الرجالي الجاهز" },
            { id: 6, name: "علي عقيل", desc: "موديلات حصرية بجودة عالية" }
        ];

        const demoProducts = [
            { name: "تيشيرت بريميوم قطن", price: 135 },
            { name: "بنطال مودرن سليم", price: 165 },
            { name: "جاكيت خفيف عصري", price: 210 }
        ];

        let cart = [];

        function renderStores() {
            const wrapper = document.getElementById('storesWrapper');
            storesData.forEach(store => {
                wrapper.innerHTML += `
                    <div class="store-card" onclick="viewStore(${store.id})">
                        <h2>${store.name}</h2>
                        <p>${store.desc}</p>
                        <button class="btn btn-dark" style="margin-top:20px;">تصفح التشكيلة</button>
                    </div>`;
            });
        }

        function viewStore(id) {
            const store = storesData.find(s => s.id === id);
            document.getElementById('storesWrapper').style.display = 'none';
            document.getElementById('productsWrapper').style.display = 'block';
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('currentStoreName').innerText = store.name;

            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            demoProducts.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-placeholder">IMAGE PREVIEW</div>
                        <h4 style="color:var(--vision-navy);">${item.name}</h4>
                        <p style="color:var(--vision-gold); font-weight:bold; font-size:1.3em; margin:10px 0;">${item.price} ريال</p>
                        <button class="btn btn-dark" onclick="addToCart('${item.name}', ${item.price}, '${store.name}')">أضف للحقيبة</button>
                    </div>`;
            });
        }

        function showStoresList() {
            document.getElementById('storesWrapper').style.display = 'grid';
            document.getElementById('productsWrapper').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
        }

        function addToCart(name, price, store) {
            cart.push({name, price, store});
            document.getElementById('cartCount').innerText = cart.length;
            // لا حاجة لـ alert، سنغير نص الزر مؤقتاً لمزيد من الاحترافية
            const btn = event.target;
            btn.innerText = "✓ تم الحجز";
            btn.style.background = "#27ae60";
            setTimeout(() => {
                btn.innerText = "أضف للحقيبة";
                btn.style.background = "var(--vision-navy)";
            }, 1000);
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            const overlay = document.getElementById('overlay');
            const itemsDiv = document.getElementById('cartItems');
            
            itemsDiv.innerHTML = cart.length === 0 ? "<p style='text-align:center;'>حقيبة التسوق فارغة</p>" : 
                cart.map(i => `<p style="font-size:0.9em; border-bottom:1px solid #eee; padding:12px 0;"><b>${i.name}</b> <br> <span style="color:#666;">المصدر: ${i.store}</span> | <b>${i.price} ريال</b></p>`).join('');
            
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('totalPrice').innerText = total;

            const isVisible = modal.style.display === 'block';
            modal.style.display = isVisible ? 'none' : 'block';
            overlay.style.display = isVisible ? 'none' : 'block';
        }

        function sendToWhatsApp() {
            if(cart.length === 0) return;
            let msg = "*طلب شراء جديد - منصة VISION*\n";
            msg += "--------------------------\n";
            cart.forEach((i, index) => {
                msg += `${index+1}. *${i.name}* (${i.store})\n   السعر: ${i.price} ريال\n`;
            });
            msg += "--------------------------\n";
            msg += `*الإجمالي المستحق: ${document.getElementById('totalPrice').innerText} ريال*`;
            window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`);
        }

        renderStores();
    </script>
</body>
</html>
