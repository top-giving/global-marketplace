<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MODERN HUB | Dynamic Experience</title>
    <style>
        :root {
            --purple: #6c5ce7;
            --blue: #0984e3;
            --dark: #0f0c29;
        }

        /* 1. تأثير الخلفية المتحركة */
        body { 
            font-family: 'Segoe UI', sans-serif; 
            margin: 0; 
            padding: 0; 
            color: white;
            background: linear-gradient(-45deg, #0f0c29, #302b63, #24243e, #0f0f12);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            min-height: 100vh;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* 2. هيدر زجاجي */
        header { 
            background: rgba(0, 0, 0, 0.3);
            backdrop-filter: blur(15px);
            padding: 25px; 
            text-align: center; 
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            position: sticky; top: 0; z-index: 1000;
        }

        /* 3. تأثير التوهج لأيقونة المتجر */
        .store-card { 
            background: rgba(255, 255, 255, 0.05); 
            border-radius: 20px; 
            padding: 40px; 
            text-align: center; 
            cursor: pointer; 
            transition: 0.5s; 
            border: 1px solid rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(5px);
            position: relative;
        }

        .store-card:hover { 
            transform: translateY(-10px);
            background: rgba(255, 255, 255, 0.1);
            border-color: var(--purple);
            /* توهج الأيقونة */
            box-shadow: 0 0 20px rgba(108, 92, 231, 0.6), inset 0 0 10px rgba(108, 92, 231, 0.4);
        }

        .store-card h2 { 
            text-shadow: 0 0 10px rgba(255,255,255,0.3);
        }

        /* تصميم الأزرار والشبكة */
        .container { max-width: 1100px; margin: 40px auto; padding: 0 20px; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        
        .btn-glow {
            background: var(--purple);
            color: white;
            border: none;
            padding: 12px 25px;
            border-radius: 50px;
            font-weight: bold;
            cursor: pointer;
            box-shadow: 0 0 15px rgba(108, 92, 231, 0.4);
            transition: 0.3s;
        }
        .btn-glow:hover { box-shadow: 0 0 25px rgba(108, 92, 231, 0.8); transform: scale(1.05); }

        /* السلة والتفاصيل */
        #cartModal { 
            display: none; position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%); 
            background: rgba(15, 15, 18, 0.95); padding: 35px; border-radius: 30px; z-index: 2000; 
            width: 90%; max-width: 450px; border: 1px solid var(--purple);
            backdrop-filter: blur(20px);
        }
        .overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); z-index: 1500; }
        
        .product-card { background: rgba(0,0,0,0.2); border-radius: 15px; padding: 20px; border: 1px solid rgba(255,255,255,0.05); text-align: center; }
        .img-box { width: 100%; height: 250px; background: rgba(255,255,255,0.05); border-radius: 12px; margin-bottom: 15px; display: flex; align-items: center; justify-content: center; color: #555; }
    </style>
</head>
<body>

    <header>
        <h1 style="background: linear-gradient(to right, #fff, var(--purple)); -webkit-background-clip: text; -webkit-text-fill-color: transparent;">TOP GIVING MARKET</h1>
        <div style="margin-top: 15px;">
            <button class="btn-glow" onclick="toggleCart()">🛒 حقيبة التسوق (<span id="cartCount">0</span>)</button>
        </div>
    </header>

    <div class="container">
        <button id="backBtn" class="btn-glow" style="background:#444; margin-bottom: 20px; display: none;" onclick="showStoresList()">← المتاجر</button>
        <div id="storesWrapper" class="grid"></div>
        <div id="productsWrapper" style="display:none;">
            <h2 id="currentStoreName" style="text-align: center; color: var(--purple); margin-bottom: 30px;"></h2>
            <div id="productsGrid" class="grid"></div>
        </div>
    </div>

    <div class="overlay" id="overlay" onclick="toggleCart()"></div>
    <div id="cartModal">
        <h3 style="text-align: center;">إتمام الطلب الرقمي</h3>
        <div id="cartItems"></div>
        <hr style="border: 0; border-top: 1px solid rgba(255,255,255,0.1); margin: 20px 0;">
        <div style="display: flex; justify-content: space-between; align-items: center; font-size: 1.4em;">
            <span>الإجمالي:</span>
            <span style="color: var(--purple); font-weight: bold;"><span id="totalPrice">0</span> ريال</span>
        </div>
        <button class="btn-glow" style="background: #25d366; width: 100%; margin-top: 20px; font-size: 1.1em;" onclick="sendToWhatsApp()">واتساب</button>
    </div>

    <script>
        const MY_PHONE = "966560564719";
        const storesData = [
            { id: 1, name: "توب جيفينج", desc: "أحدث موديلات الملابس الجاهزة" },
            { id: 2, name: "أناقة الشرق", desc: "تميز في اختياراتك الرجالية" },
            { id: 3, name: "عزوة", desc: "للملابس الفاخرة والعصرية" },
            { id: 4, name: "زهرة بلقيس", desc: "تشكيلة ملابس جاهزة متنوعة" },
            { id: 5, name: "ديرة نجد", desc: "أناقة الملبس الرجالي الجاهز" },
            { id: 6, name: "علي عقيل", desc: "موديلات حصرية بجودة عالية" }
        ];

        const demoProducts = [
            { name: "تيشيرت عصري", price: 120 },
            { name: "بنطال كاجوال", price: 150 },
            { name: "جاكيت شيك", price: 200 }
        ];

        let cart = [];

        function renderStores() {
            const wrapper = document.getElementById('storesWrapper');
            wrapper.innerHTML = '';
            storesData.forEach(store => {
                wrapper.innerHTML += `
                    <div class="store-card" onclick="viewStore(${store.id})">
                        <h2>${store.name}</h2>
                        <p>${store.desc}</p>
                        <button class="btn-glow" style="margin-top:20px;">دخول</button>
                    </div>`;
            });
        }

        function viewStore(id) {
            const store = storesData.find(s => s.id === id);
            document.getElementById('storesWrapper').style.display = 'none';
            document.getElementById('productsWrapper').style.display = 'block';
            document.getElementById('backBtn').style.display = 'inline-block';
            document.getElementById('currentStoreName').innerText = store.name;

            const grid = document.getElementById('productsGrid');
            grid.innerHTML = '';
            demoProducts.forEach(item => {
                grid.innerHTML += `
                    <div class="product-card">
                        <div class="img-box">IMAGE</div>
                        <h4>${item.name}</h4>
                        <p style="color:var(--purple); font-weight:bold;">${item.price} ريال</p>
                        <button class="btn-glow" onclick="addToCart('${item.name}', ${item.price}, '${store.name}')">إضافة للسلة</button>
                    </div>`;
            });
        }

        function showStoresList() {
            document.getElementById('storesWrapper').style.display = 'grid';
            document.getElementById('productsWrapper').style.display = 'none';
            document.getElementById('backBtn').style.display = 'none';
            renderStores();
        }

        function addToCart(name, price, store) {
            cart.push({name, price, store});
            document.getElementById('cartCount').innerText = cart.length;
            const btn = event.target;
            btn.innerText = "✓ تمت الإضافة";
            btn.style.background = "#25d366";
            setTimeout(() => {
                btn.innerText = "إضافة للسلة";
                btn.style.background = "var(--purple)";
            }, 1000);
        }

        function toggleCart() {
            const modal = document.getElementById('cartModal');
            const overlay = document.getElementById('overlay');
            const itemsDiv = document.getElementById('cartItems');
            itemsDiv.innerHTML = cart.length === 0 ? "<p>الحقيبة فارغة</p>" : 
                cart.map(i => `<p style="font-size:0.9em; border-bottom:1px solid rgba(255,255,255,0.1); padding:10px 0;">${i.name} (${i.store}) - <b>${i.price} ريال</b></p>`).join('');
            const total = cart.reduce((sum, i) => sum + i.price, 0);
            document.getElementById('totalPrice').innerText = total;
            modal.style.display = modal.style.display === 'block' ? 'none' : 'block';
            overlay.style.display = overlay.style.display === 'block' ? 'none' : 'block';
        }

        function sendToWhatsApp() {
            if(cart.length === 0) return;
            let msg = "*طلب شراء جديد - MODERN HUB*\n";
            cart.forEach((i, idx) => msg += `${idx+1}. ${i.name} (${i.store}) - ${i.price} ريال\n`);
            msg += `\n*الإجمالي: ${document.getElementById('totalPrice').innerText} ريال*`;
            window.open(`https://wa.me/${MY_PHONE}?text=${encodeURIComponent(msg)}`);
        }

        renderStores();
    </script>
</body>
</html>
